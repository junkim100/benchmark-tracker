name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A commit pushed with GITHUB_TOKEN does not trigger other workflows, so the
  # research run cannot rely on its own push firing this. It calls it instead.
  workflow_call:
    inputs:
      ref:
        description: "Ref to build. A caller that just pushed must name it."
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Every action is pinned to a commit rather than a tag. A tag is a mutable pointer in somebody else's repository, so asking for a major version is a standing agreement to run whatever they push to it next, which is the shape the tj-actions compromise took. The trailing comment is the human-readable half; the SHA is the part GitHub actually checks.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A called workflow defaults to the caller's github.sha, which is the tree
      # as it was when the run started. A caller that commits during its own run
      # must therefore name the ref, or the deploy silently publishes the state
      # from before its own findings.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          # This job only reads. Persisting the token into .git/config would hand a repo credential to every install script npm runs two steps below, for nothing in return.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # normalize.mjs exits non-zero on a data contract breach, so a bad
      # research record fails the build instead of reaching the site.
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

name: Research

on:
  schedule:
    # Every third day at 13:37 UTC. Early morning in the Americas and after the
    # working day in Asia, so a release published anywhere is usually up. The
    # odd minute is deliberate: GitHub delays scheduled runs under load and the
    # top of every hour is the busiest slot.
    - cron: "37 13 */3 * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to search"
        default: "7"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The alias gate is Python: the TypeSafe SDK has no JS client. research.mjs
      # shells out to it once per run with the whole batch on stdin.
      # Both steps are allowed to fail. The gate degrades to "review everything"
      # without Python or the SDK, so a PyPI outage should cost us the second
      # opinion for one run, not the whole research pass.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
        continue-on-error: true

      - name: Research each lab
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Second opinion on proposed alias merges. If this secret is absent the
          # gate returns REVIEW for everything and the run still succeeds: no
          # merge is written, the suggestions queue up, and nothing is lost.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # The lookback is deliberately longer than the interval. If it only
          # just covered the gap, one delayed or dropped run would leave a
          # permanent hole, and GitHub drops scheduled runs often enough for
          # that to happen. At seven days every release gets two or three
          # chances to be found, and duplicates cost nothing because records
          # are deduplicated by source URL.
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: node scripts/research.mjs

      # The same check the site build runs. A malformed or score-bearing record
      # fails here, before it can reach main.
      - name: Validate against the data contract
        run: npm run normalize

      - name: Commit anything new
        id: commit
        run: |
          # Ask the script what it found, not git. normalize.mjs stamps a fresh
          # generated_at into timeline.json every run, so data/ is never clean
          # and this branch could never be taken.
          ADDED=$(cat research-added.txt 2>/dev/null || echo 0)
          if [ "$ADDED" -eq 0 ]; then
            echo "No new releases."
            git checkout -- data || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "benchmark-tracker bot"
          git config user.email "noreply@github.com"
          # The generated files too. Committing only the sources left the repo
          # claiming 775 releases while the deployed site correctly served 779.
          git add data
          git commit -m "Research: $(date -u +%Y-%m-%d)

          $(cat research-summary.txt)"
          # The repo takes human commits too, and a rejected push under `bash -e`
          # would abort the step, leave `changed` unset and skip the deploy,
          # discarding the run's alias and category work with it.
          for attempt in 1 2 3; do
            git push && break
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Only when something landed, and only as an explicit call: the bot's own push
  # cannot trigger the deploy workflow on its own.
  deploy:
    needs: research
    if: needs.research.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    # main, not the caller's SHA: the bot's commit landed after this run started.
    with:
      ref: main
